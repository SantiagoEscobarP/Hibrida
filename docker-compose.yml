services:
  # Base de datos de Grafos RDF / SPARQL
  fuseki:
    image: secoresearch/fuseki:latest
    container_name: news_fuseki
    restart: unless-stopped
    ports:
      - "${FUSEKI_PORT}:3030"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JAVA_OPTIONS=-Xmx2048m -Xms512m
    volumes:
      - fuseki_data:/fuseki-base
    networks:
      - news_network

  # Base de datos relacional para Keycloak
  keycloak_db:
    image: postgres:16-alpine
    container_name: news_keycloak_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - news_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servidor de Identidad y Acceso (IAM)
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: news_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    ports:
      - "${KEYCLOAK_PORT}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /
      KC_HEALTH_ENABLED: "true"
    depends_on:
      keycloak_db:
        condition: service_healthy
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
    networks:
      - news_network
      
# --- AGREGA ESTOS DOS SERVICIOS A TU DOCKER-COMPOSE ACTUAL ---

  backend:
    build:
      context: ./Back
      dockerfile: Dockerfile
    container_name: pressindex_backend
    ports:
      - "8000:8000"
    environment:
      # Reemplaza "fuseki" y "keycloak" si tus servicios tienen otro nombre en tu compose
      - FUSEKI_BASE_URL=http://localhost:3030
      - FUSEKI_DATASET=noticias_op
      - FUSEKI_USER=admin
      - FUSEKI_PASSWORD=${ADMIN_PASSWORD}
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080
      - KEYCLOAK_REALM=noticias-realm
      - KEYCLOAK_ISSUER=http://localhost:8080/realms/noticias-realm
    volumes:
      - ./Back:/app
    depends_on:
      - fuseki
      - keycloak
    restart: unless-stopped
    # Si tus servicios actuales tienen una red asignada, pon la misma aquí:
    # networks:
    #   - nombre_de_tu_red

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pressindex_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    # Si tus servicios actuales tienen una red asignada, pon la misma aquí:
    # networks:
    #   - nombre_de_tu_red

volumes:
  fuseki_data:
    driver: local
  postgres_keycloak_data:
    driver: local

networks:
  news_network:
    driver: bridge